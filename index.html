<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>App El Espectador</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vollkorn:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Portada de entrada: misma línea gráfica del deck (Green forest, Banana light, Dark trunk; Vollkorn + Source Sans).
   El usuario elige la versión Light o Dark de la propuesta. */
:root {
  --verde: #0B785D;
  --banana: #F4DF97;
  --tronco: #462B0D;
  --crema: #FFF6E6;
  --tinta: #1B1918;
  --gris: #6B6561;
  --linea: #E4D9C4;
  --blanco: #FFFFFF;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { overflow-x: hidden; background: var(--crema); color: var(--tinta); font-family: 'Source Sans 3', system-ui, sans-serif; }

.portada { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: 57fr 43fr; }

.p-izq { position: relative; display: flex; align-items: center; padding: 8vh 7.8vw; background-color: var(--verde); background-image: linear-gradient(rgb(255 255 255 / .06) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .06) 1px, transparent 1px); background-size: 40px 40px; }
.eyebrow { font: 600 clamp(14px, 1.05vw, 20px) 'Source Sans 3', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--crema); margin: 0 0 18px; }
.display { font: 700 clamp(48px, 5.4vw, 104px)/1.02 'Vollkorn', Georgia, serif; color: var(--banana); margin: 0 0 30px; text-wrap: balance; }
.sub { font: 400 clamp(18px, 1.6vw, 30px)/1.45 'Source Sans 3', sans-serif; color: var(--crema); margin: 0; max-width: 30ch; }
.bloque { position: absolute; left: 7.8vw; bottom: 8vh; width: 260px; max-width: 40%; height: 14px; background: var(--banana); }

.p-der { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(24px, 4vh, 44px); padding: 6vh 5vw; }
.portada-logo { height: clamp(64px, 6.8vw, 130px); width: auto; }
.p-hr { display: block; width: min(560px, 90%); height: 1px; background: var(--linea); }
.p-cliente-logo { width: min(420px, 80%); height: auto; }

.elegir { width: min(560px, 100%); margin-top: clamp(8px, 2vh, 24px); }
.elegir-tit { font: 600 clamp(13px, .95vw, 18px) 'Source Sans 3', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--verde); margin: 0 0 16px; text-align: center; }
.opciones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.opcion { display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 20px; background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px; color: var(--tinta); text-decoration: none; transition: border-color .2s, box-shadow .2s, translate .2s; }
.opcion:hover { border-color: var(--verde); box-shadow: 0 10px 30px rgb(11 120 93 / .14); translate: 0 -3px; }
.opcion:focus-visible { outline: 3px solid var(--verde); outline-offset: 3px; }
.muestra { aspect-ratio: 16 / 10; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 7px; }
.muestra span { display: block; height: 8px; border-radius: 4px; }
.muestra .t { width: 70%; height: 12px; }
.muestra .l1 { width: 90%; } .muestra .l2 { width: 60%; }
.muestra .acento { margin-top: auto; width: 34%; height: 12px; background: var(--banana); }
.light { background: var(--crema); border: 1px solid var(--linea); }
.light .t { background: var(--verde); } .light .l1, .light .l2 { background: var(--linea); }
.dark { background: var(--tinta); }
.dark .t { background: var(--banana); } .dark .l1, .dark .l2 { background: rgb(255 255 255 / .16); }
.opcion-nom { display: flex; align-items: center; justify-content: space-between; font: 700 clamp(22px, 1.7vw, 32px) 'Vollkorn', Georgia, serif; color: var(--verde); }
.opcion-nom::after { content: '→'; font: 400 .8em 'Source Sans 3', sans-serif; transition: translate .2s; }
.opcion:hover .opcion-nom::after { translate: 4px 0; }
.opcion-desc { font: 400 clamp(14px, .95vw, 17px)/1.35 'Source Sans 3', sans-serif; color: var(--gris); margin: -6px 0 0; }

@media (max-width: 860px) {
  .portada { grid-template-columns: minmax(0, 1fr); }
  .p-izq { padding: 56px 16px 72px; }
  .bloque { left: 16px; bottom: 32px; }
  .p-der { padding: 40px 16px 48px; }
}
@media (max-width: 400px) {
  .opciones { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .opcion, .opcion-nom::after { transition: none; }
}
</style>
</head>
